name: Release Windows Build

# v* タグ（例: v1.0.0）を push すると起動し、Windows exe をビルドして Release に添付する
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release を作成するタグ名（例: v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Windows binary
        shell: bash
        run: wails build -platform windows/amd64

      # exe が大きいため zip 化して添付する。ライセンス表示物（LICENSE /
      # THIRD_PARTY_LICENSES.md = D2 の MPL-2.0 等）も同梱して配布要件を満たす。
      - name: Package zip
        shell: pwsh
        run: |
          $staging = "release"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item build/bin/sirusita.exe $staging/
          Copy-Item LICENSE $staging/
          Copy-Item THIRD_PARTY_LICENSES.md $staging/
          Copy-Item README.md $staging/
          Compress-Archive -Path "$staging/*" -DestinationPath build/bin/sirusita-windows-amd64.zip -Force

      # コンテンツ（contents/ 配下のサンプルメモ集）は exe とは別の ZIP にして配布する。
      # 利用者はアプリの「インポート」からこの ZIP をそのまま取り込める（sirusita 形式）。
      - name: Package contents zip
        shell: pwsh
        run: |
          Compress-Archive -Path "contents/*.md" -DestinationPath build/bin/sirusita-contents.zip -Force

      - name: Upload zip to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Store 版（https://apps.microsoft.com/detail/9PPT0S6GKBLW）のリンクは、
          # Store での公開を確認してから追加する（CLAUDE.md「Microsoft Store」参照）。
          body: |
            **ブラウザ: [Web 版](https://sirusita.e17.click/)**（インストール不要。メモはブラウザ内に保存）

            **Windows:** `sirusita-windows-amd64.zip` を展開して `sirusita.exe` を実行してください。
            未署名のため、Windows 11 のスマート アプリ コントロールにブロックされることがあります。
          files: |
            build/bin/sirusita-windows-amd64.zip
            build/bin/sirusita-contents.zip
          fail_on_unmatched_files: true
